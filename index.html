<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>パシュトのおならジャンプ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 1画面のゲーム。キャンバスを画面いっぱいに置き、UIはその上に重ねる */
:root {
  --night: #1d1738;
  --ink: #fff8e6;
  --gas: #e9d24a;
  --gas-deep: #b59a1c;
  --wood: #7a5236;
  --panel: rgba(29, 23, 56, .92);
  --danger: #ff6b6b;
  --font-pop: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; background: var(--night); }
#game { display: block; image-rendering: auto; touch-action: none; }

/* 上部ボタン */
.topbar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; z-index: 5; }
.topbar button, .panel button { font-family: var(--font-body); font-weight: 800; font-size: 13px; color: var(--ink); background: rgba(0,0,0,.35); border: 2px solid rgba(255,248,230,.5); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.topbar button:focus-visible, .panel button:focus-visible, .start button:focus-visible { outline: 3px solid var(--gas); outline-offset: 2px; }

/* タッチ操作 */
.touch { position: fixed; inset: auto 0 0 0; height: 0; z-index: 4; }
.touch[hidden] { display: none !important; }
.dpad { position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 190px; height: 92px; display: flex; touch-action: none; }
.dpad span { flex: 1; display: grid; place-items: center; font-size: 30px; border: 3px solid rgba(255,248,230,.45); background: rgba(0,0,0,.28); color: var(--ink); }
.dpad span:first-child { border-radius: 46px 10px 10px 46px; border-right-width: 1px; }
.dpad span:last-child { border-radius: 10px 46px 46px 10px; border-left-width: 1px; }
.dpad span.on { background: rgba(255,248,230,.3); }
.abtn { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-pop); font-size: 15px; color: var(--ink); border: 3px solid rgba(255,248,230,.5); background: rgba(0,0,0,.3); touch-action: none; }
.abtn.on { transform: scale(.94); background: rgba(255,248,230,.3); }
#btnJump { right: calc(max(14px, env(safe-area-inset-right, 0px)) + 100px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
#btnFart { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); background: rgba(181,154,28,.45); border-color: var(--gas); }
#btnFart.on { background: rgba(233,210,74,.6); }

/* スタート画面・クリア画面 */
.start { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(15, 11, 32, .78); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; overflow-y: auto; }
.start .card { max-width: 560px; width: 100%; text-align: center; display: grid; gap: 12px; }
.start h1 { font-family: var(--font-pop); font-weight: 400; font-size: clamp(26px, 5vw, 40px); margin: 0; color: var(--gas); text-wrap: balance; text-shadow: 0 3px 0 #5a4710; }
.start p { margin: 0; line-height: 1.6; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; font-size: 14px; }
.keys div { background: rgba(255,248,230,.08); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.keys b { color: var(--gas); }
kbd { font-family: var(--font-body); font-weight: 800; font-size: 12px; background: var(--ink); color: var(--night); border-radius: 5px; padding: 1px 6px; }
.start button.go { justify-self: center; font-family: var(--font-pop); font-size: 20px; color: var(--night); background: var(--gas); border: 0; border-radius: 999px; padding: 12px 36px; cursor: pointer; box-shadow: 0 4px 0 var(--gas-deep); }
.rotate { font-size: 13px; opacity: .8; }

/* 調整パネル */
.panel { position: fixed; z-index: 8; top: calc(env(safe-area-inset-top, 0px) + 48px); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: min(330px, calc(100vw - 20px)); overflow-y: auto; background: var(--panel); border: 2px solid rgba(255,248,230,.25); border-radius: 14px; padding: 12px 14px; font-size: 13px; touch-action: pan-y; -webkit-user-select: none; }
.panel h2 { font-family: var(--font-pop); font-weight: 400; font-size: 16px; margin: 0 0 4px; color: var(--gas); }
.panel h3 { font-size: 12px; letter-spacing: .08em; margin: 12px 0 4px; opacity: .7; }
.panel .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0; }
.panel .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--gas); }
.panel .row output { font-variant-numeric: tabular-nums; color: var(--gas); }
.panel label.chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.panel .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><canvas id="game" width="960" height="540"></canvas></div>

<div class="topbar">
  <button id="btnSound" type="button">音 ON</button>
  <button id="btnTune" type="button">調整</button>
  <button id="btnReset" type="button">やり直す</button>
</div>

<div class="touch" id="touch" hidden>
  <div class="dpad" id="dpad"><span id="padL">◀</span><span id="padR">▶</span></div>
  <div class="abtn" id="btnJump">ジャンプ</div>
  <div class="abtn" id="btnFart">おなら</div>
</div>

<div class="start" id="start">
  <div class="card">
    <h1>パシュトのおならジャンプ</h1>
    <p>操作感をためすプロトタイプです。<br>ぬいぐるみのクマを目指して進んでね。</p>
    <div class="keys">
      <div><b>パソコン</b><br>
        移動 <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd><br>
        ジャンプ <kbd>Space</kbd> / <kbd>Z</kbd> / <kbd>↑</kbd><br>
        おなら <kbd>X</kbd> / <kbd>Shift</kbd>（長押しで噴射し続ける）<br>
        調整画面 <kbd>P</kbd>　やり直す <kbd>R</kbd>
      </div>
      <div><b>スマホ</b><br>
        左下の ◀ ▶ で移動<br>
        右下のボタンでジャンプとおなら<br>
        <b>地上</b>でおなら → おならジャンプ<br>
        <b>地上</b>で ◀▶＋おなら → おならダッシュ<br>
        <b>空中</b>でおなら長押し → 下に噴射して上昇
      </div>
    </div>
    <p class="rotate" id="rotateHint" hidden>スマホは横向きにすると遊びやすいです</p>
    <button class="go" id="btnGo" type="button">スタート</button>
  </div>
</div>

<div class="panel" id="panel" hidden></div>

<script src="vendor/spine-canvas.min.js"></script>
<script>
(() => {
'use strict';

// ===================== 調整できるパラメータ =====================
const PARAM_DEFS = [
  ['移動', [
    ['moveSpeed', '歩く速さ', 100, 500, 10, 270],
    ['groundAccel', '地上の加速', 500, 6000, 100, 2600],
    ['airAccel', '空中の操作性', 200, 5000, 100, 1500],
    ['gravity', '重力', 800, 4000, 50, 2200],
    ['jumpV', 'ジャンプ力', 300, 1100, 10, 700],
  ]],
  ['おなら噴射', [
    ['groundFartV', '地上おならジャンプ力', 400, 1400, 10, 860],
    ['groundFartCost', '地上おならジャンプの消費', 0, 60, 1, 24],
    ['airBurstV', '空中噴射の初速', 0, 900, 10, 430],
    ['burstCost', '空中噴射の消費（押した瞬間）', 0, 50, 1, 14],
    ['thrustAccel', '長押し中の推進力', 0, 6000, 50, 3000],
    ['maxRise', '上昇スピード上限', 100, 1200, 10, 520],
    ['drain', '長押し中の消費（毎秒）', 0, 150, 1, 50],
    ['dashV', 'おならダッシュの速さ', 200, 1400, 10, 640],
    ['dashTime', 'おならダッシュの時間', 0.05, 0.6, 0.01, 0.28],
    ['dashCost', 'おならダッシュの消費', 0, 60, 1, 20],
  ]],
  ['ゲージとプスー', [
    ['regen', '着地中の回復（毎秒）', 0, 200, 1, 40],
    ['pusuV', 'プスーで浮く強さ', 0, 500, 10, 190],
    ['pusuCD', 'プスーの間隔（秒）', 0.1, 2, 0.05, 0.55],
  ]],
  ['煙', [
    ['smokeLife', '煙が残る時間（秒）', 0.5, 8, 0.1, 3.0],
    ['smokeRate', '煙の出る間隔（秒）', 0.015, 0.15, 0.005, 0.035],
    ['smokeSize', '煙の大きさ', 0.5, 2.5, 0.05, 1.0],
    ['smokeDmgInterval', '敵へのダメージ間隔（秒）', 0.1, 2, 0.05, 0.35],
  ]],
];
const DEFAULTS = {};
PARAM_DEFS.forEach(([, list]) => list.forEach(([k, , , , , v]) => { DEFAULTS[k] = v; }));
const P = Object.assign({}, DEFAULTS);
const OPTS = { infinite: false, hitbox: false };
const STORE_KEY = 'chloe-proto-params-v1';
try { const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (saved) { for (const k in DEFAULTS) if (typeof saved[k] === 'number') P[k] = saved[k]; } } catch (e) {}
function saveParams() { try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) {} }

const GAUGE_MAX = 100;

// ===================== キャンバスと画面サイズ =====================
const app = document.getElementById('app');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VIEW_H = 540;
let VIEW_W = 960, renderScale = 1;
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  VIEW_W = Math.max(720, Math.min(1280, Math.round(VIEW_H * w / h)));
  const s = Math.min(w / VIEW_W, h / VIEW_H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.round(VIEW_W * s) + 'px';
  canvas.style.height = Math.round(VIEW_H * s) + 'px';
  canvas.width = Math.round(VIEW_W * s * dpr);
  canvas.height = Math.round(VIEW_H * s * dpr);
  renderScale = s * dpr;
  document.getElementById('rotateHint').hidden = !(h > w && isTouch);
}
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
window.addEventListener('resize', resize);

// ===================== 画像 =====================
const sprite = new Image();
let spriteReady = false;
sprite.onload = () => { spriteReady = true; };
sprite.src = 'assets/pasyuto.png';
const SPRITE_NATURAL_FACING = -1; // 予備の1枚絵は左向き（しっぽが右側）として扱う

// ===================== Spine =====================
// assets/spine/ の pasyuto.json / .atlas / .png を読み込む。失敗したら1枚絵で表示する
const SPINE_SCALE = 0.1;            // Spine上の約830px → ゲーム内で約83px
const SPINE_NATURAL_FACING = 1;     // Spineのデータは右向き
let sp = null;
(async () => {
  try {
    if (!window.spine) throw new Error('spine runtime not loaded');
    const am = new spine.AssetManager('assets/spine/');
    am.loadText('pasyuto.json');
    am.loadTextureAtlas('pasyuto.atlas');
    await am.loadAll();
    const json = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(am.require('pasyuto.atlas')));
    json.scale = SPINE_SCALE;
    const data = json.readSkeletonData(am.require('pasyuto.json'));
    // blink は目だけを動かす。おしりの表示切り替えキーが入っていると噴射中におしりが消えるので取り除く
    const blink = data.findAnimation('blink');
    if (blink) {
      const hide = ['右おしり', '左おしり'].map(n => data.findSlot(n)).filter(Boolean).map(sl => sl.index);
      blink.setTimelines(blink.timelines.filter(t => !(t instanceof spine.AttachmentTimeline && hide.includes(t.slotIndex))));
    }
    const skeleton = new spine.Skeleton(data);
    skeleton.setToSetupPose();
    const stateData = new spine.AnimationStateData(data);
    stateData.defaultMix = .08;
    stateData.setMix('fart_start', 'fart_air', 0);
    stateData.setMix('jump_start', 'jump_loop', 0);
    stateData.setMix('fall_start', 'fall_loop', 0);
    stateData.setMix('jump_loop', 'fall_start', .12);
    const state = new spine.AnimationState(stateData);
    state.setAnimation(0, 'idle', true);
    const renderer = new spine.SkeletonRenderer(ctx);
    renderer.triangleRendering = false;
    const buttSlot = skeleton.findSlot('butt');
    sp = { skeleton, state, renderer, cur: 'idle', blinkT: 2, buttSlot, buttAtt: buttSlot && skeleton.getAttachment(buttSlot.data.index, 'butt'), v: new spine.Vector2() };
  } catch (e) { console.warn('Spineを読み込めなかったので1枚絵で表示します', e); }
})();

function updateSpine(dt) {
  if (!sp) return;
  const p = player, st = sp.state;
  let want;
  if (p.hurtT > 0) want = 'hurt';
  else if (p.pusuT > 0) want = 'pusu';
  else if (p.thrusting || p.dashT > 0) want = 'fart_air';
  else if (p.onGround) want = Math.abs(p.vx) > 30 ? 'run' : 'idle';
  else want = p.vy < 0 ? 'jump' : 'fall';
  if (want !== sp.cur) {
    const two = { fart_air: ['fart_start', 'fart_air'], jump: ['jump_start', 'jump_loop'], fall: ['fall_start', 'fall_loop'] }[want];
    if (two) { st.setAnimation(0, two[0], false); st.addAnimation(0, two[1], true, 0); }
    else st.setAnimation(0, want, !(want === 'pusu' || want === 'hurt'));
    if (!['idle', 'run', 'jump', 'fall'].includes(want)) st.clearTrack(1);
    sp.cur = want;
  }
  const e0 = st.getCurrent(0);
  if (e0) e0.timeScale = want === 'run' ? clamp(Math.abs(p.vx) / P.moveSpeed, .6, 1.8) : 1;
  // まばたき（噴射中は ＞＜ の顔なのでしない）
  sp.blinkT -= dt;
  if (sp.blinkT <= 0) {
    sp.blinkT = rand(2, 5);
    if (['idle', 'run', 'jump', 'fall'].includes(want)) { st.setAnimation(1, 'blink', false); st.addEmptyAnimation(1, 0, 0); }
  }
  st.update(dt);
}
function poseSpine() {
  const p = player, sk = sp.skeleton;
  let sx = 1, sy = 1;
  if (p.onGround) { if (p.land > 0) { sy = .88; sx = 1.1; } }
  else if (!p.thrusting) { if (p.vy < -150) { sx = .93; sy = 1.07; } else if (p.vy > 300) { sx = .96; sy = 1.04; } }
  sk.x = p.x + p.w / 2; sk.y = p.y + p.h + 2;
  sk.scaleX = sx * (p.facing === SPINE_NATURAL_FACING ? 1 : -1);
  sk.scaleY = -sy; // Spineは上がプラス、キャンバスは下がプラス
  sp.state.apply(sk);
  sk.updateWorldTransform(spine.Physics ? spine.Physics.update : undefined);
}

// ===================== ステージ =====================
const WORLD_W = 4500, WORLD_H = 1000, GY = 900;
const R = (x, y, w, h) => ({ x, y, w, h });
const solids = [
  R(0, GY, 700, 100),                 // スタート地点
  R(900, GY, 350, 100),               // 小さい穴の先
  R(1250, 640, 300, 360),             // 高い壁
  R(1550, GY, 500, 100),              // 天井の低い通路の手前
  R(1950, 700, 450, 140),             // 低い天井
  R(2240, GY, 510, 100),              // 塔のふもと
  R(2750, 420, 450, 580),             // 高台
  R(3420, 470, 90, 24),               // 浮島1
  R(3660, 440, 90, 24),               // 浮島2
  R(3900, 420, 600, 580),             // ゴール地点
];
const oneways = [
  R(2440, 785, 120, 14), R(2600, 665, 120, 14), R(2440, 545, 120, 14), R(2600, 430, 110, 14),
];
const signs = [
  { x: 120, lines: ['← → で移動', 'ジャンプは Space / Z'] },
  { x: 560, lines: ['穴が広い！', 'ジャンプ中におなら長押しで', '下に噴射して浮く'] },
  { x: 1060, lines: ['高い壁は', '地上でおなら＝おならジャンプ', '長押しでさらに上へ'] },
  { x: 1640, lines: ['天井が低い！', '← → を押しながら地上でおなら', '＝おならダッシュ'] },
  { x: 2320, lines: ['足場を登ろう', '着地するとゲージ回復'] },
  { x: 3000, lines: ['ゲージが足りないと', 'プスー…と一瞬だけ浮く', '残量に注意！'] },
  { x: 3960, lines: ['煙は残るよ', '敵を煙に誘いこもう'] },
];
const GOAL = { x: 4330, y: 420 };
const ENEMY_DEFS = [
  { x: 470, y: GY, min: 300, max: 660 },
  { x: 1050, y: GY, min: 960, max: 1220 },
  { x: 1420, y: 640, min: 1260, max: 1520 },
  { x: 1800, y: GY, min: 1600, max: 2020 },
  { x: 2620, y: GY, min: 2320, max: 2720 },
  { x: 2900, y: 420, min: 2770, max: 3180 },
  { x: 3100, y: 420, min: 2770, max: 3180 },
  { x: 4120, y: 420, min: 3920, max: 4280 },
];

// ===================== 便利関数 =====================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function pointInSolid(x, y) { for (const s of solids) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return true; return false; }
function circleRect(cx, cy, r, b) { const nx = clamp(cx, b.x, b.x + b.w), ny = clamp(cy, b.y, b.y + b.h); return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r; }

function moveAndCollide(b, dt) {
  b.onGround = false; b.hitCeil = false; b.hitWall = 0;
  b.x += b.vx * dt;
  if (b.vx !== 0) for (const s of solids) if (overlap(b, s)) {
    if (b.vx > 0) { b.x = s.x - b.w; b.hitWall = 1; } else { b.x = s.x + s.w; b.hitWall = -1; }
    b.vx = 0;
  }
  if (b.x < 0) { b.x = 0; b.vx = 0; b.hitWall = -1; }
  if (b.x + b.w > WORLD_W) { b.x = WORLD_W - b.w; b.vx = 0; b.hitWall = 1; }
  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  for (const s of solids) if (overlap(b, s)) {
    if (b.vy > 0) { b.y = s.y - b.h; b.onGround = true; b.ground = s; }
    else if (b.vy < 0) { b.y = s.y + s.h; b.hitCeil = true; }
    b.vy = 0;
  }
  if (b.vy >= 0) for (const p of oneways) {
    if (b.x + b.w > p.x && b.x < p.x + p.w && prevBottom <= p.y + 0.5 && b.y + b.h >= p.y) {
      b.y = p.y - b.h; b.vy = 0; b.onGround = true; b.ground = p;
    }
  }
}

// ===================== サウンド（WebAudioで毎回ちがうおなら音を合成） =====================
let ac = null, master = null, noiseBuf = null, soundOn = true;
function ensureAudio() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = soundOn ? 0.7 : 0; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function setSound(on) { soundOn = on; if (master) master.gain.value = on ? 0.7 : 0; document.getElementById('btnSound').textContent = on ? '音 ON' : '音 OFF'; }

// 8種類のプリセット＋毎回ランダムな揺らぎ。直前と同じプリセットは選ばない
const FARTS = [
  { name: 'ブッ',     f: 95,  wave: 'sawtooth', am: 'square',   flutter: 28, wob: 6,  wd: .15, cut: 900,  q: 4,  noise: .25, glide: .8 },
  { name: 'ブリリッ', f: 120, wave: 'square',   am: 'square',   flutter: 36, wob: 9,  wd: .2,  cut: 1300, q: 6,  noise: .2,  glide: .7 },
  { name: 'プゥ〜',   f: 230, wave: 'triangle', am: 'sine',     flutter: 18, wob: 4,  wd: .1,  cut: 2000, q: 8,  noise: .1,  glide: 1.3 },
  { name: 'ボフッ',   f: 70,  wave: 'sawtooth', am: 'sine',     flutter: 22, wob: 3,  wd: .1,  cut: 500,  q: 2,  noise: .6,  glide: .9 },
  { name: 'ブォォ',   f: 80,  wave: 'sawtooth', am: 'square',   flutter: 30, wob: 2,  wd: .3,  cut: 700,  q: 3,  noise: .3,  glide: 1.0 },
  { name: 'ピッ',     f: 330, wave: 'square',   am: 'square',   flutter: 45, wob: 12, wd: .12, cut: 2600, q: 10, noise: .05, glide: 1.2 },
  { name: 'ブブブッ', f: 105, wave: 'square',   am: 'square',   flutter: 14, wob: 5,  wd: .2,  cut: 1100, q: 5,  noise: .15, glide: .85 },
  { name: 'ムフゥ',   f: 160, wave: 'triangle', am: 'sine',     flutter: 25, wob: 7,  wd: .25, cut: 1600, q: 4,  noise: .35, glide: 1.1 },
];
let lastFart = -1;
function pickFart() { let i; do { i = Math.floor(Math.random() * FARTS.length); } while (i === lastFart && FARTS.length > 1); lastFart = i; return FARTS[i]; }

// dur を渡すと一発、渡さないと stop() まで鳴り続ける
function fartVoice(dur, loud = 1) {
  const pr = pickFart();
  const handle = { name: pr.name, stop() {}, setPitch() {} };
  if (!ac || !soundOn) return handle;
  const t = ac.currentTime;
  const base = pr.f * rand(.92, 1.08);
  const glideTime = dur || 1.4;
  const osc = ac.createOscillator(); osc.type = pr.wave;
  osc.frequency.setValueAtTime(base * 1.15, t);
  osc.frequency.exponentialRampToValueAtTime(base, t + .04);
  osc.frequency.exponentialRampToValueAtTime(base * pr.glide, t + .04 + glideTime);
  const lfo = ac.createOscillator(); lfo.frequency.value = pr.wob * rand(.8, 1.2);
  const lfoG = ac.createGain(); lfoG.gain.value = base * pr.wd; lfo.connect(lfoG); lfoG.connect(osc.frequency);
  const am = ac.createOscillator(); am.type = pr.am; am.frequency.value = pr.flutter * rand(.85, 1.15);
  const amG = ac.createGain(); amG.gain.value = .45;
  const vca = ac.createGain(); vca.gain.value = .55; am.connect(amG); amG.connect(vca.gain);
  const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = pr.cut * rand(.85, 1.15); filt.Q.value = pr.q;
  const ns = ac.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true; ns.playbackRate.value = rand(.7, 1.1);
  const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = base * 3; nf.Q.value = 1.2;
  const ng = ac.createGain(); ng.gain.value = pr.noise;
  const env = ac.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(.5 * loud, t + .012);
  osc.connect(vca); vca.connect(filt); ns.connect(nf); nf.connect(ng); ng.connect(filt); filt.connect(env); env.connect(master);
  const nodes = [osc, lfo, am, ns];
  nodes.forEach(n => n.start(t));
  let stopped = false;
  const stop = (rel = .12) => {
    if (stopped) return; stopped = true;
    const n = ac.currentTime;
    env.gain.cancelScheduledValues(n); env.gain.setValueAtTime(env.gain.value, n); env.gain.linearRampToValueAtTime(0, n + rel);
    osc.frequency.cancelScheduledValues(n); osc.frequency.setValueAtTime(osc.frequency.value, n); osc.frequency.exponentialRampToValueAtTime(Math.max(30, base * .6), n + rel);
    nodes.forEach(x => { try { x.stop(n + rel + .05); } catch (e) {} });

  handle.setPitch = (m) => { if (stopped) return; const n = ac.currentTime; osc.frequency.cancelScheduledValues(n); osc.frequency.setTargetAtTime(base * m, n, .08); };

}
function sfxPusu() {
  if (!ac || !soundOn) return;
  const t = ac.currentTime;
  const ns = ac.createBufferSource(); ns.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.6;
  bp.frequency.setValueAtTime(2600, t); bp.frequency.exponentialRampToValueAtTime(800, t + .45);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.45, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + .5);
  ns.connect(bp); bp.connect(g); g.connect(master); ns.start(t); ns.stop(t + .55);

  o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(240, t + .12);
  const og = ac.createGain(); og.gain.setValueAtTime(.12, t); og.gain.exponentialRampToValueAtTime(.001, t + .14);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + .16);
}
function tone(type, f1, f2, dur, vol) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);

const sfxJump = () => tone('sine', 380, 720, .1, .12);
const sfxHit = () => tone('square', 260, 90, .12, .08);
const sfxPop = () => tone('triangle', 600, 1400, .15, .12);
const sfxBump = () => tone('sawtooth', 160, 70, .15, .08);
function sfxClear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone('triangle', f, f, .25, .14), i * 110)); }

// ===================== 入力 =====================
const keys = new Set();
const touchState = { left: false, right: false, jump: false, fart: false };
const KEY_LEFT = ['ArrowLeft', 'KeyA'], KEY_RIGHT = ['ArrowRight', 'KeyD'];
const KEY_JUMP = ['Space', 'KeyZ', 'ArrowUp', 'KeyW'], KEY_FART = ['KeyX', 'ShiftLeft', 'ShiftRight', 'KeyK'];
const anyKey = list => list.some(k => keys.has(k));
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  ensureAudio();
  if ([...KEY_LEFT, ...KEY_RIGHT, ...KEY_JUMP, ...KEY_FART, 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'KeyP') togglePanel();
  if (e.code === 'KeyR') resetGame();
  if (e.code === 'Enter' && !startEl.hidden) startGame();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); Object.keys(touchState).forEach(k => touchState[k] = false); });

function bindHold(el, key) {
  const on = e => { e.preventDefault(); ensureAudio(); touchState[key] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { touchState[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
}
bindHold(document.getElementById('btnJump'), 'jump');
bindHold(document.getElementById('btnFart'), 'fart');
// 十字キー：指をすべらせて左右を切り替えられる
(() => {
  const pad = document.getElementById('dpad'), L = document.getElementById('padL'), Rr = document.getElementById('padR');
  let pid = null;
  const set = (e) => {
    const r = pad.getBoundingClientRect();
    const left = e.clientX < r.left + r.width / 2;
    touchState.left = left; touchState.right = !left;
    L.classList.toggle('on', left); Rr.classList.toggle('on', !left);
  };
  const clear = () => { pid = null; touchState.left = touchState.right = false; L.classList.remove('on'); Rr.classList.remove('on'); };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); pid = e.pointerId; try { pad.setPointerCapture(pid); } catch (_) {} set(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) set(e); });
  pad.addEventListener('pointerup', e => { if (e.pointerId === pid) clear(); });
  pad.addEventListener('pointercancel', clear);
  pad.addEventListener('lostpointercapture', clear);
})();
document.addEventListener('touchmove', e => { if (!e.target.closest('.panel')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

function readInput() {
  const inp = {
    left: anyKey(KEY_LEFT) || touchState.left,
    right: anyKey(KEY_RIGHT) || touchState.right,
    jump: anyKey(KEY_JUMP) || touchState.jump,
    fart: anyKey(KEY_FART) || touchState.fart,
  };
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp) continue;
    const b = i => gp.buttons[i] && gp.buttons[i].pressed;
    if (gp.axes[0] < -.4 || b(14)) inp.left = true;
    if (gp.axes[0] > .4 || b(15)) inp.right = true;
    if (b(0)) inp.jump = true;
    if (b(1) || b(2) || b(5) || b(7)) inp.fart = true;
  }
  return inp;
}

// ===================== ゲーム状態 =====================
let player, enemies, puffs, parts, texts, cam, gauge, gaugeFlash, timer, cleared, running = false, prevInp = {}, jumpBuffer = 0, fartQueued = false;

function makeEnemy(d) { return { x: d.x - 18, y: d.y - 26, w: 36, h: 26, vx: 55 * (Math.random() < .5 ? -1 : 1), vy: 0, hp: 3, inv: 0, flash: 0, dead: false, respawn: 0, def: d, t: Math.random() * 10 }; }

function resetGame() {
  player = { x: 60, y: GY - 50, w: 32, h: 50, vx: 0, vy: 0, facing: 1, onGround: false, coyote: 0, jumping: false,
    thrusting: false, voice: null, emitT: 0, dashT: 0, dashDir: 1, pusuCD: 0, pusuT: 0, inv: 0, land: 0, regenDelay: 0,
    safe: { x: 60, y: GY - 50 }, anim: 0, wasGround: false };
  enemies = ENEMY_DEFS.map(makeEnemy);
  puffs = []; parts = []; texts = [];
  cam = { x: 0, y: GY - VIEW_H + 80 };
  gauge = GAUGE_MAX; gaugeFlash = 0; timer = 0; cleared = false;
  document.getElementById('start').hidden && hideClear();
}

// ===================== 煙・パーティクル・文字 =====================
function spawnPuff(x, y, vx, vy, opt = {}) {
  if (puffs.length > 500) puffs.shift();
  const s = P.smokeSize * (opt.size || 1);
  const life = (opt.life || P.smokeLife) * rand(.85, 1.15);
  puffs.push({ x, y, vx, vy, r: 0, r0: rand(7, 11) * s, rmax: rand(20, 32) * s, life, max: life, dmg: opt.dmg !== false,
    seed: Math.random() * 6.28, hue: opt.hue != null ? opt.hue : rand(48, 58), sat: opt.sat != null ? opt.sat : 85 });
}
function addText(x, y, str, color = '#fff8e6', size = 18, life = .9, vy = -50) { texts.push({ x, y, str, color, size, life, max: life, vy, rot: rand(-.15, .15) }); }
function addParts(x, y, n, color, spd = 200) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(.3, 1) * spd; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(.3, .7), max: .7, color, r: rand(2, 5) }); } }

function butt() {
  const p = player;
  if (sp && sp.buttAtt) { const v = sp.buttAtt.computeWorldPosition(sp.buttSlot.bone, sp.v); return { x: v.x, y: v.y }; }
  return { x: p.x + p.w / 2 - p.facing * 8, y: p.y + p.h - 10 };
}

// ===================== おなら =====================
function startThrust(voice) {
  const p = player;
  p.thrusting = true;
  if (p.voice) p.voice.stop();
  p.voice = voice || fartVoice(0);
  const b = butt();
  addText(b.x - p.facing * 14, b.y + 6, p.voice.name, '#ffe76a', 20, .8, -40);
}
function stopThrust() { const p = player; p.thrusting = false; if (p.voice) { p.voice.stop(.15); p.voice = null; } }

function pusu() {
  const p = player;
  gaugeFlash = .7;
  if (p.pusuCD > 0) return;
  p.pusuCD = P.pusuCD; p.pusuT = .7;
  p.vy = p.onGround ? -P.pusuV * .7 : -P.pusuV;
  p.jumping = false;
  sfxPusu();
  const b = butt();
  for (let i = 0; i < 4; i++) spawnPuff(b.x, b.y, rand(-30, 30), rand(30, 80), { size: .45, life: .9, dmg: false, sat: 25 });
  addText(b.x, b.y - 30, 'プスー…', '#d8d0b8', 18, 1.0, -30);
}

function doFart(dir) {
  const p = player;
  if (OPTS.infinite) gauge = GAUGE_MAX;
  const b = butt();
  if (p.onGround) {
    if (dir !== 0) {
      if (gauge < P.dashCost) return pusu();
      gauge -= P.dashCost;
      stopThrust();
      p.facing = dir; p.dashDir = dir; p.dashT = P.dashTime; p.vx = dir * P.dashV; p.vy = -40; p.jumping = false;
      const v = fartVoice(.45, 1);
      addText(b.x - dir * 20, b.y - 4, v.name, '#ffe76a', 20, .8, -40);
      for (let i = 0; i < 8; i++) spawnPuff(b.x, b.y, -dir * rand(120, 260), rand(-40, 20));
    } else {
      if (gauge < P.groundFartCost) return pusu();
      gauge -= P.groundFartCost;
      p.vy = -P.groundFartV; p.onGround = false; p.coyote = 0; p.jumping = false;
      for (let i = 0; i < 14; i++) { const s = i % 2 ? 1 : -1; spawnPuff(b.x, p.y + p.h - 6, s * rand(60, 320), rand(-20, 10)); }
      startThrust(fartVoice(0, 1.15));
    }
  } else {
    if (gauge < P.burstCost) return pusu();
    gauge -= P.burstCost;
    p.vy = Math.min(p.vy, -P.airBurstV); p.jumping = false;
    for (let i = 0; i < 6; i++) spawnPuff(b.x, b.y, rand(-80, 80), rand(120, 260));
    startThrust();
  }
}

// ===================== 更新 =====================
function updatePlayer(dt, inp) {
  const p = player;
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  p.coyote = p.onGround ? .08 : Math.max(0, p.coyote - dt);
  p.pusuCD = Math.max(0, p.pusuCD - dt); p.pusuT = Math.max(0, p.pusuT - dt);
  p.inv = Math.max(0, p.inv - dt); p.hurtT = Math.max(0, (p.hurtT || 0) - dt); p.land = Math.max(0, p.land - dt);

  // 横移動
  if (p.dashT > 0) {
    p.dashT -= dt; p.vx *= Math.exp(-1.2 * dt);
    p.emitT -= dt;
    if (p.emitT <= 0) { p.emitT = P.smokeRate; const b = butt(); spawnPuff(b.x, b.y, -p.dashDir * rand(60, 160), rand(-30, 30)); }
  } else {
    const target = dir * P.moveSpeed;
    if (!p.onGround && dir !== 0 && Math.sign(p.vx) === dir && Math.abs(p.vx) > P.moveSpeed) p.vx *= Math.exp(-2 * dt);
    else p.vx = approach(p.vx, target, (p.onGround ? P.groundAccel : P.airAccel) * dt);
    if (dir !== 0) p.facing = dir;
  }

  // ジャンプ（先行入力とコヨーテタイム付き）
  if (jumpBuffer > 0 && p.coyote > 0) {
    p.vy = -P.jumpV; p.coyote = 0; jumpBuffer = 0; p.jumping = true; p.onGround = false; sfxJump();
  }
  if (p.jumping && !inp.jump && p.vy < 0) { p.vy *= .45; p.jumping = false; }
  if (p.vy >= 0) p.jumping = false;

  // おなら
  if (fartQueued) { fartQueued = false; doFart(dir); }
  if (p.thrusting) {
    if (OPTS.infinite) gauge = GAUGE_MAX;
    if (!inp.fart) stopThrust();
    else {
      if (p.vy > -P.maxRise) p.vy = Math.max(p.vy - P.thrustAccel * dt, -P.maxRise);
      gauge -= P.drain * dt;
      if (p.voice) p.voice.setPitch(1 + (1 - gauge / GAUGE_MAX) * .5);
      p.emitT -= dt;
      if (p.emitT <= 0) { p.emitT = P.smokeRate; const b = butt(); spawnPuff(b.x + rand(-4, 4), b.y, rand(-40, 40) + p.vx * .1, rand(150, 250)); }
      if (gauge <= 0) {
        gauge = 0; stopThrust(); gaugeFlash = .7; sfxPusu();
        addText(butt().x, butt().y - 30, 'プスッ…', '#d8d0b8', 18, 1, -30);
      }
    }
  }

  // 重力と移動
  p.vy = Math.min(p.vy + (p.dashT > 0 ? 0 : P.gravity) * dt, 1100);
  const vyBefore = p.vy;
  moveAndCollide(p, dt);
  if (p.hitWall && p.dashT > 0) p.dashT = 0;

  if (p.onGround && !p.wasGround) {
    p.land = .12;
    if (vyBefore > 500) addParts(p.x + p.w / 2, p.y + p.h, 6, '#c9b48a', 120);
  }
  p.wasGround = p.onGround;

  if (p.onGround && p.ground) {
    const g = p.ground;
    p.safe = { x: clamp(p.x, g.x + 8, g.x + g.w - p.w - 8), y: g.y - p.h };
  }

  // ゲージ回復（着地中のみ）
  if (p.onGround && !p.thrusting) { p.regenDelay -= dt; if (p.regenDelay <= 0) gauge = Math.min(GAUGE_MAX, gauge + P.regen * dt); }
  else p.regenDelay = .25;

  // 落下
  if (p.y > WORLD_H + 150) {
    stopThrust();
    p.x = p.safe.x; p.y = p.safe.y; p.vx = p.vy = 0; p.dashT = 0; p.inv = 1;
    gauge = GAUGE_MAX;
    addText(p.x + p.w / 2, p.y - 20, 'もう一回！', '#fff8e6', 22, 1.2, -30);
  }

  // ゴール
  if (!cleared && p.x + p.w > GOAL.x - 20 && p.x < GOAL.x + 20 && p.y < GOAL.y && p.y + p.h > GOAL.y - 60) {
    cleared = true; stopThrust(); sfxClear(); addParts(GOAL.x, GOAL.y - 30, 30, '#ffd1e8', 300); showClear();
  }
  p.anim += dt * (Math.abs(p.vx) > 20 && p.onGround ? Math.abs(p.vx) / 30 : 2);
}

function updateEnemies(dt) {
  const p = player;
  for (const e of enemies) {
    e.t += dt;
    if (e.dead) { e.respawn -= dt; if (e.respawn <= 0) Object.assign(e, makeEnemy(e.def)); continue; }
    e.inv = Math.max(0, e.inv - dt); e.flash = Math.max(0, e.flash - dt);
    if (e.x < e.def.min) e.vx = Math.abs(e.vx);
    if (e.x + e.w > e.def.max) e.vx = -Math.abs(e.vx);
    e.vy = Math.min(e.vy + P.gravity * dt, 1100);
    const vx = e.vx;
    moveAndCollide(e, dt);
    if (e.hitWall) e.vx = -vx; else e.vx = vx;
    // 煙に触れたらダメージ
    if (e.inv <= 0) {
      for (const s of puffs) {
        if (!s.dmg) continue;
        if (circleRect(s.x, s.y, s.r * .8, e)) {
          e.hp--; e.inv = P.smokeDmgInterval; e.flash = .15; sfxHit();
          addText(e.x + e.w / 2, e.y - 6, e.hp > 0 ? 'くさっ！' : 'うぇ〜', '#c8f07a', 16, .7, -60);
          if (e.onGround) e.vy = -180;
          if (e.hp <= 0) { e.dead = true; e.respawn = 5; addParts(e.x + e.w / 2, e.y + e.h / 2, 14, '#8fd6c8', 260); sfxPop(); }
          break;
        }
      }
    }
    // プレイヤーと接触したら弾かれる
    if (!e.dead && p.inv <= 0 && overlap(p, e)) {
      const s = Math.sign((p.x + p.w / 2) - (e.x + e.w / 2)) || 1;
      p.vx = s * 340; p.vy = -320; p.dashT = 0; p.inv = 1; p.hurtT = .4; p.jumping = false; stopThrust();
      addText(p.x + p.w / 2, p.y - 10, 'いたっ', '#ff9b9b', 16, .7, -50); sfxBump();
    }
  }
}

function updateFx(dt) {
  for (const s of puffs) {
    const ox = s.x, oy = s.y;
    const k = Math.exp(-3.2 * dt);
    s.vx *= k; s.vy = s.vy * k - 18 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (pointInSolid(s.x, s.y)) { s.x = ox; s.y = oy; s.vx *= .5; s.vy = 0; }
    s.life -= dt;
    const age = 1 - s.life / s.max;
    s.r = s.r0 + (s.rmax - s.r0) * (1 - Math.pow(1 - Math.min(1, age * 3), 3));
  }
  puffs = puffs.filter(s => s.life > 0);
  for (const q of parts) { q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const t of texts) { t.y += t.vy * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  gaugeFlash = Math.max(0, gaugeFlash - dt);
}

function updateCamera(dt) {
  const p = player;
  const tx = clamp(p.x + p.w / 2 - VIEW_W / 2 + p.facing * 70, 0, WORLD_W - VIEW_W);
  // スマホではボタンが下に重なるので、キャラを少し上に映す
  const ty = isTouch ? clamp(p.y + p.h / 2 - VIEW_H * .42, -120, WORLD_H - VIEW_H + 130)
                     : clamp(p.y + p.h / 2 - VIEW_H * .55, -120, WORLD_H - VIEW_H);
  const k = 1 - Math.exp(-6 * dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

// ===================== 描画 =====================
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * .6, r: Math.random() * 1.6 + .3, t: Math.random() * 6 }));
let clock = 0;

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, '#231a4a'); g.addColorStop(.55, '#5a3f7a'); g.addColorStop(1, '#e79a83');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  for (const s of stars) {
    ctx.globalAlpha = .5 + .5 * Math.sin(clock * 2 + s.t);
    ctx.fillStyle = '#fff8e6';
    ctx.beginPath(); ctx.arc(((s.x * 1600 - cam.x * .05) % 1600 + 1600) % 1600 * VIEW_W / 1600, s.y * VIEW_H, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 月
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(VIEW_W * .78 - cam.x * .02, 90, 34, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#231a4a';
  ctx.beginPath(); ctx.arc(VIEW_W * .78 - cam.x * .02 + 14, 82, 30, 0, 6.28); ctx.fill();
  // 遠くの魔法学校
  const ox = -cam.x * .12 + 500, oy = 330 - cam.y * .05;
  ctx.fillStyle = '#3b2c5e';
  for (let i = 0; i < 3; i++) {
    const bx = ox + i * 1300;
    ctx.fillRect(bx, oy - 60, 120, 160); ctx.fillRect(bx + 130, oy - 20, 80, 120);
    ctx.beginPath(); ctx.moveTo(bx - 10, oy - 60); ctx.lineTo(bx + 60, oy - 150); ctx.lineTo(bx + 130, oy - 60); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx + 120, oy - 20); ctx.lineTo(bx + 170, oy - 90); ctx.lineTo(bx + 220, oy - 20); ctx.fill();
    ctx.fillStyle = '#ffd77a';
    ctx.fillRect(bx + 30, oy - 20, 12, 18); ctx.fillRect(bx + 75, oy + 10, 12, 18); ctx.fillRect(bx + 160, oy + 10, 10, 16);
    ctx.fillStyle = '#3b2c5e';
  }
  // 丘
  hills(.25, 380, 60, '#4a3870', 0.004);
  hills(.45, 430, 50, '#3a5a5a', 0.006);
}
function hills(par, base, amp, color, freq) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, VIEW_H);
  const yoff = -cam.y * par * .4;
  for (let x = 0; x <= VIEW_W; x += 16) {
    const wx = x + cam.x * par;
    ctx.lineTo(x, base + yoff + Math.sin(wx * freq) * amp + Math.sin(wx * freq * 2.3 + 1) * amp * .4);
  }
  ctx.lineTo(VIEW_W, VIEW_H); ctx.fill();
}

function drawSolid(s) {
  ctx.fillStyle = '#6a4632'; ctx.fillRect(s.x, s.y, s.w, s.y + s.h >= WORLD_H ? s.h + 400 : s.h);
  ctx.fillStyle = '#5a3a28';
  for (let yy = s.y + 26; yy < s.y + s.h + (s.y + s.h >= WORLD_H ? 400 : 0); yy += 28) for (let xx = s.x + ((yy / 28) % 2) * 20 + 8; xx < s.x + s.w - 10; xx += 46) ctx.fillRect(xx, yy, 14, 6);
  ctx.fillStyle = '#69b85a'; ctx.fillRect(s.x, s.y, s.w, Math.min(12, s.h));
  ctx.fillStyle = '#8bd56f'; ctx.fillRect(s.x, s.y, s.w, 4);
  ctx.fillStyle = '#69b85a';
  for (let xx = s.x + 6; xx < s.x + s.w - 6; xx += 18) { ctx.beginPath(); ctx.arc(xx, s.y + 12, 5, 0, Math.PI); ctx.fill(); }
}
function drawOneway(p) {
  ctx.fillStyle = '#a8764c'; ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#7a5236'; ctx.fillRect(p.x, p.y + p.h - 4, p.w, 4);
  ctx.fillRect(p.x + 10, p.y + p.h, 6, 10); ctx.fillRect(p.x + p.w - 16, p.y + p.h, 6, 10);
}
function groundYAt(x) { let best = WORLD_H; for (const s of solids) if (x >= s.x && x <= s.x + s.w && s.y < best) best = s.y; return best; }
function drawSign(sg) {
  const gy = groundYAt(sg.x);
  ctx.font = '13px ' + FONT_BODY;
  const w = Math.max(...sg.lines.map(l => ctx.measureText(l).width)) + 22;
  const h = sg.lines.length * 18 + 14;
  const x = sg.x - w / 2, y = gy - 40 - h;
  ctx.fillStyle = '#5a3a28'; ctx.fillRect(sg.x - 4, y + h, 8, 40);
  ctx.fillStyle = '#c9965f'; roundRect(x, y, w, h, 6); ctx.fill();
  ctx.strokeStyle = '#7a5236'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#3a2618'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  sg.lines.forEach((l, i) => ctx.fillText(l, sg.x, y + 8 + i * 18));
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawGoal() {
  const x = GOAL.x, y = GOAL.y + Math.sin(clock * 3) * 4 - 6;
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = .35 + .15 * Math.sin(clock * 4); ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(0, -26, 40, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#c98b5a';
  ctx.beginPath(); ctx.arc(-14, -50, 9, 0, 6.28); ctx.arc(14, -50, 9, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -14, 18, 16, 0, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -38, 17, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#f2d2b0'; ctx.beginPath(); ctx.ellipse(0, -33, 8, 6, 0, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -12, 10, 9, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#2a1a10';
  ctx.beginPath(); ctx.arc(-6, -41, 2.4, 0, 6.28); ctx.arc(6, -41, 2.4, 0, 6.28); ctx.arc(0, -35, 2.4, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#e8577a'; ctx.beginPath(); ctx.moveTo(-8, -24); ctx.lineTo(0, -21); ctx.lineTo(8, -24); ctx.lineTo(8, -18); ctx.lineTo(0, -21); ctx.lineTo(-8, -18); ctx.fill();
  ctx.restore();
  ctx.font = '14px ' + FONT_POP; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#fff3c4';
  ctx.fillText('ゴール', x, GOAL.y - 70);
}

function drawEnemy(e) {
  if (e.dead) return;
  const sq = 1 + Math.sin(e.t * 8) * .06;
  const cx = e.x + e.w / 2, by = e.y + e.h;
  ctx.save(); ctx.translate(cx, by); ctx.scale(1 / sq, sq);
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#7fd1bf';
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.quadraticCurveTo(-22, -30, 0, -30); ctx.quadraticCurveTo(22, -30, 20, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-8, -21, 5, 3, -.4, 0, 6.28); ctx.fill();
  const lx = Math.sign(e.vx) * 3;
  ctx.fillStyle = '#1d1738';
  if (e.inv > 0) { ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('> <', lx, -14); }
  else { ctx.beginPath(); ctx.arc(-6 + lx, -14, 3, 0, 6.28); ctx.arc(6 + lx, -14, 3, 0, 6.28); ctx.fill(); }
  ctx.restore();
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < e.hp ? '#ff8fb1' : 'rgba(255,255,255,.25)'; ctx.fillRect(cx - 13 + i * 9, e.y - 10, 7, 4); }
  if (OPTS.hitbox) { ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.strokeRect(e.x, e.y, e.w, e.h); }
}

function drawPuffs() {
  for (const s of puffs) {
    const a = s.life / s.max;
    let alpha = (a < .35 ? a / .35 : 1) * (s.dmg ? .62 : .45);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${s.hue}, ${s.sat}%, 58%)`;
    for (let i = 0; i < 3; i++) {
      const ang = s.seed + i * 2.1 + clock * .4;
      ctx.beginPath(); ctx.arc(s.x + Math.cos(ang) * s.r * .35, s.y + Math.sin(ang) * s.r * .25, s.r * (.62 + i * .1), 0, 6.28); ctx.fill();
    }
    if (s.dmg && s.max - s.life > .5 && ((s.seed * 100) | 0) % 5 === 0) {
      ctx.strokeStyle = `hsla(80, 60%, 45%, ${alpha})`; ctx.lineWidth = 2; ctx.beginPath();
      const yy = s.y - s.r - 6 + Math.sin(clock * 3 + s.seed) * 3;
      for (let k = 0; k < 3; k++) { const xx = s.x - 10 + k * 10; ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 4, yy - 6, xx, yy - 12); }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0) return;
  const cx = p.x + p.w / 2, by = p.y + p.h + 2;
  let sx = 1, sy = 1, rot = 0, jx = 0, jy = 0;
  if (p.onGround) {
    if (Math.abs(p.vx) > 20) { rot = Math.sin(p.anim) * .07; sy = 1 + Math.abs(Math.sin(p.anim)) * .05; }
    else sy = 1 + Math.sin(clock * 3) * .02;
    if (p.land > 0) { sy *= .85; sx *= 1.12; }
  } else {
    if (p.vy < -150) { sx = .92; sy = 1.08; } else if (p.vy > 300) { sx = .95; sy = 1.05; }
  }
  if (p.thrusting) { jx = rand(-1.2, 1.2); jy = rand(-1, 1); sy *= 1.03; }
  if (p.dashT > 0) { rot = p.facing * .25; sx *= 1.05; }
  if (sp) {
    poseSpine();
    if (p.thrusting) { ctx.save(); ctx.translate(rand(-1, 1), rand(-1, 1)); }
    sp.renderer.draw(sp.skeleton);
    if (p.thrusting) ctx.restore();
  } else {
  const size = 76;
  ctx.save(); ctx.translate(cx + jx, by + jy); ctx.rotate(rot); ctx.scale(sx * (p.facing === SPRITE_NATURAL_FACING ? 1 : -1), sy);
  if (spriteReady) ctx.drawImage(sprite, -size / 2, -size, size, size);
  else { ctx.fillStyle = '#222'; ctx.fillRect(-16, -50, 32, 50); }
  ctx.restore();
  }
  if (p.pusuT > 0) {
    ctx.fillStyle = '#7ec8ff';
    const dx = cx + p.facing * 22, dy = p.y + 6 + (1 - p.pusuT) * 10;
    ctx.beginPath(); ctx.moveTo(dx, dy - 8); ctx.quadraticCurveTo(dx + 6, dy + 2, dx, dy + 4); ctx.quadraticCurveTo(dx - 6, dy + 2, dx, dy - 8); ctx.fill();
  }
  if (OPTS.hitbox) {
    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 1; ctx.strokeRect(p.x, p.y, p.w, p.h);
    const b = butt(); ctx.fillStyle = '#f0f'; ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  }
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const a = Math.min(1, t.life / (t.max * .4));
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.rot);
    ctx.globalAlpha = a;
    ctx.font = t.size + 'px ' + FONT_POP;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(29,23,56,.85)'; ctx.strokeText(t.str, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.str, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const x = 18, y = 16, w = 230, h = 18;
  ctx.font = '13px ' + FONT_POP; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#fff8e6'; ctx.fillText('おならゲージ', x, y + 14);
  const by = y + 20;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(x - 3, by - 3, w + 6, h + 6, 8); ctx.fill();
  const ratio = gauge / GAUGE_MAX;
  const low = gauge < P.burstCost;
  ctx.fillStyle = gaugeFlash > 0 && Math.floor(gaugeFlash * 12) % 2 === 0 ? '#ff6b6b' : low ? '#c9a23a' : '#e9d24a';
  if (ratio > 0) { roundRect(x, by, Math.max(h, w * ratio), h, 6); ctx.fill(); }
  // 必要量の目安線
  const marks = [[P.burstCost, '空中'], [P.groundFartCost, '地上']];
  ctx.font = '10px ' + FONT_BODY; ctx.textBaseline = 'top';
  for (const [c, label] of marks) {
    const mx = x + w * c / GAUGE_MAX;
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(mx - 1, by - 2, 2, h + 4);
  }
  ctx.fillStyle = '#fff8e6'; ctx.textAlign = 'right'; ctx.font = '12px ' + FONT_BODY; ctx.textBaseline = 'bottom';
  ctx.fillText(Math.ceil(gauge) + ' / ' + GAUGE_MAX, x + w, y + 14);
  ctx.textAlign = 'left';
  ctx.fillText('タイム ' + timer.toFixed(1) + '秒', x, by + h + 22);
  if (OPTS.infinite) { ctx.fillStyle = '#9fe6ff'; ctx.fillText('ゲージ無限', x + 120, by + h + 22); }
}

function render() {
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  drawBackground();
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  for (const sg of signs) drawSign(sg);
  for (const o of oneways) drawOneway(o);
  for (const s of solids) if (s.x < cam.x + VIEW_W && s.x + s.w > cam.x) drawSolid(s);
  drawGoal();
  for (const e of enemies) drawEnemy(e);
  drawPuffs();
  drawPlayer();
  for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawTexts();
  ctx.restore();
  drawHUD();
}

// ===================== ループ =====================
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function frame(now) {
  let dt = Math.min(.1, (now - last) / 1000); last = now;
  clock += dt;
  if (running) {
    const inp = readInput();
    if (inp.jump && !prevInp.jump) jumpBuffer = .1;
    if (inp.fart && !prevInp.fart) fartQueued = true;
    prevInp = inp;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 12) {
      updatePlayer(STEP, inp); updateEnemies(STEP); updateFx(STEP); updateSpine(STEP);
      jumpBuffer = Math.max(0, jumpBuffer - STEP);
      acc -= STEP; n++;
    }
    if (!cleared) timer += dt;
    updateCamera(dt);
  }
  render();
  requestAnimationFrame(frame);
}

// ===================== 画面まわり =====================
const startEl = document.getElementById('start');
let clearEl = null;
function startGame() {
  ensureAudio();
  startEl.hidden = true;
  resetGame();
  running = true;
  document.getElementById('touch').hidden = !isTouch;
}
function showClear() {
  clearEl = document.createElement('div');
  clearEl.className = 'start';
  clearEl.innerHTML = `<div class="card"><h1>ぬいぐるみゲット！</h1><p>タイム ${timer.toFixed(2)} 秒</p><button class="go" type="button">もう一回</button></div>`;
  clearEl.querySelector('button').addEventListener('click', () => { resetGame(); });
  document.body.appendChild(clearEl);
}
function hideClear() { if (clearEl) { clearEl.remove(); clearEl = null; } }
document.getElementById('btnGo').addEventListener('click', startGame);
document.getElementById('btnReset').addEventListener('click', e => { e.currentTarget.blur(); if (running) resetGame(); });
document.getElementById('btnSound').addEventListener('click', e => { e.currentTarget.blur(); ensureAudio(); setSound(!soundOn); });
document.getElementById('btnTune').addEventListener('click', e => { e.currentTarget.blur(); togglePanel(); });

// 調整パネル
const panel = document.getElementById('panel');
function buildPanel() {
  let html = '<h2>操作感の調整</h2><p style="margin:0;opacity:.75">動かしながら数値を変えられます。設定はこのブラウザに保存されます。</p>';
  for (const [group, list] of PARAM_DEFS) {
    html += `<h3>${group}</h3>`;
    for (const [k, label, min, max, step] of list) {
      html += `<div class="row"><label for="p_${k}">${label}</label><output id="o_${k}"></output><input type="range" id="p_${k}" min="${min}" max="${max}" step="${step}"></div>`;
    }
  }
  html += `<h3>テスト用</h3>
    <label class="chk"><input type="checkbox" id="opt_infinite"> ゲージ無限</label>
    <label class="chk"><input type="checkbox" id="opt_hitbox"> 当たり判定を表示</label>
    <div class="btns"><button type="button" id="btnDefaults">初期値に戻す</button><button type="button" id="btnCopy">数値をコピー</button><button type="button" id="btnClose">閉じる</button></div>
    <p id="copyMsg" style="margin:6px 0 0;opacity:.75"></p>`;
  panel.innerHTML = html;
  for (const [, list] of PARAM_DEFS) for (const [k, , , , step] of list) {
    const inp = document.getElementById('p_' + k), out = document.getElementById('o_' + k);
    const fmt = v => step < 1 ? Number(v).toFixed(step < .01 ? 3 : 2) : String(Math.round(v));
    inp.value = P[k]; out.textContent = fmt(P[k]);
    inp.addEventListener('input', () => { P[k] = parseFloat(inp.value); out.textContent = fmt(P[k]); saveParams(); });
  }
  document.getElementById('opt_infinite').checked = OPTS.infinite;
  document.getElementById('opt_hitbox').checked = OPTS.hitbox;
  document.getElementById('opt_infinite').addEventListener('change', e => { OPTS.infinite = e.target.checked; });
  document.getElementById('opt_hitbox').addEventListener('change', e => { OPTS.hitbox = e.target.checked; });
  document.getElementById('btnDefaults').addEventListener('click', () => { Object.assign(P, DEFAULTS); saveParams(); buildPanel(); });
  document.getElementById('btnClose').addEventListener('click', togglePanel);
  document.getElementById('btnCopy').addEventListener('click', () => {
    const txt = JSON.stringify(P, null, 1);
    const msg = document.getElementById('copyMsg');
    try {
      navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'コピーしました'; }, () => { msg.textContent = txt; });
    } catch (e) { msg.textContent = txt; }
  });
}
function togglePanel() { if (panel.hidden) buildPanel(); panel.hidden = !panel.hidden; }

// フォント
const FONT_POP = '"Mochiy Pop One", "Hiragino Maru Gothic ProN", sans-serif';
const FONT_BODY = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif';
if (document.fonts && document.fonts.load) { document.fonts.load('16px "Mochiy Pop One"'); document.fonts.load('16px "M PLUS Rounded 1c"'); }

resize();
resetGame();
requestAnimationFrame(frame);
})();
</script>
